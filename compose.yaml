services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend_challenge
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d backend_challenge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
